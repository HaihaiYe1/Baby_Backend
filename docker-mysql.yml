version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: baby-monitor-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=baby
      - MYSQL_USER=fastapi
      - MYSQL_PASSWORD=171008
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./baby.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
